apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kairos.fullname" . }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "kairos.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.backend.env.APP_NAME | quote }}
  ENVIRONMENT: {{ .Values.backend.env.ENVIRONMENT | quote }}
  PORT: {{ .Values.backend.env.PORT | quote }}
  DB_HOST: {{ .Values.postgresql.host | quote }}
  DB_PORT: {{ .Values.postgresql.port | quote }}
  DB_NAME: {{ .Values.postgresql.database | quote }}
