apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kairos.fullname" . }}-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "kairos.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.postgresql.username | quote }}
  DB_PASSWORD: {{ .Values.postgresql.password | quote }}
  DATABASE_URL: "postgresql+psycopg2://{{ .Values.postgresql.username }}:{{ .Values.postgresql.password }}@{{ .Values.postgresql.host }}:{{ .Values.postgresql.port }}/{{ .Values.postgresql.database }}"
