apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: kairos
  labels:
    app: kairos-postgres
    app.kubernetes.io/name: kairos
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: kairos-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: kairos-backend
  namespace: kairos
  labels:
    app: kairos-backend
    app.kubernetes.io/name: kairos
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: kairos-backend
---
apiVersion: v1
kind: Service
metadata:
  name: kairos-frontend
  namespace: kairos
  labels:
    app: kairos-frontend
    app.kubernetes.io/name: kairos
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: kairos-frontend
