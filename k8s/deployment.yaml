apiVersion: apps/v1
kind: Deployment
metadata:
  name: kairos-postgres
  namespace: kairos
  labels:
    app: kairos-postgres
    app.kubernetes.io/name: kairos
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kairos-postgres
  template:
    metadata:
      labels:
        app: kairos-postgres
        app.kubernetes.io/name: kairos
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "kairos_db"
            - name: POSTGRES_USER
              value: "kairos_user"
            - name: POSTGRES_PASSWORD
              value: "kairos_secure_password_2026"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U kairos_user -d kairos_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kairos-backend
  namespace: kairos
  labels:
    app: kairos-backend
    app.kubernetes.io/name: kairos
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kairos-backend
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
      labels:
        app: kairos-backend
        app.kubernetes.io/name: kairos
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/alienx5499/kairos-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: APP_NAME
              value: "Kairos SRE Incident Engine"
            - name: ENVIRONMENT
              value: "production"
            - name: PORT
              value: "8000"
            - name: DATABASE_URL
              value: "postgresql://kairos_user:kairos_secure_password_2026@postgres-service:5432/kairos_db"
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "kairos_user"
            - name: DB_PASSWORD
              value: "kairos_secure_password_2026"
            - name: DB_NAME
              value: "kairos_db"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kairos-frontend
  namespace: kairos
  labels:
    app: kairos-frontend
    app.kubernetes.io/name: kairos
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kairos-frontend
  template:
    metadata:
      labels:
        app: kairos-frontend
        app.kubernetes.io/name: kairos
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/alienx5499/kairos-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: BACKEND_UPSTREAM
              value: "kairos-backend:8000"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
